<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b6bcb">
<meta name="description" content="Guided heart failure risk assessment — one question at a time, with a 0–100 risk score and colour zone at the end.">
<title>Indian HF App — Heart Failure Risk</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="appbar">
  <div class="progress" role="progressbar" aria-label="Assessment progress">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <div class="appbar-row">
    <button type="button" id="btn-back" class="icon-btn" aria-label="Previous question">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <div class="appbar-title">
      <span id="section-label"></span>
    </div>
    <button type="button" id="btn-menu" class="icon-btn" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <circle cx="12" cy="5" r="1.8" fill="currentColor"/>
        <circle cx="12" cy="12" r="1.8" fill="currentColor"/>
        <circle cx="12" cy="19" r="1.8" fill="currentColor"/>
      </svg>
    </button>
  </div>
</header>

<main id="stage" class="stage"><!-- one step at a time, rendered by app.js --></main>

<footer id="footer" class="footer">
  <button type="button" id="btn-primary" class="btn primary">Start</button>
  <span class="enter-hint">press <kbd>Enter</kbd></span>
</footer>

<dialog id="menu-sheet" class="sheet">
  <h2>Menu</h2>
  <button type="button" id="menu-result" class="sheet-item">Jump to the score</button>
  <button type="button" id="menu-sample" class="sheet-item">Fill with a sample patient</button>
  <button type="button" id="menu-export" class="sheet-item">Export answers (JSON)</button>
  <button type="button" id="menu-import" class="sheet-item">Import answers (JSON)</button>
  <button type="button" id="menu-restart" class="sheet-item danger">Start over</button>
  <button type="button" id="menu-close" class="sheet-item close">Close</button>
</dialog>

<input type="file" id="file-import" accept="application/json" hidden>

<script type="module" src="assets/app.js"></script>
</body>
</html>
